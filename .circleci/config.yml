---
version: 2.1

orbs:
  kazoo: official-2600hz/kazoo@dev:alpha

workflows:
  version: 2
  build_branch:
    jobs:
      - kazoo/build-preparation:
          context: Private-Builds
          name: preparation-<< matrix.platform >>
          target-type: kapp
          platform: << matrix.platform >>
          matrix:
            parameters:
              platform: [centos-7, rockylinux-8, rockylinux-9]
      - kazoo/build:
          context: Private-Builds
          name: beams-<< matrix.platform >>
          platform: << matrix.platform >>
          matrix:
            parameters:
              platform: [centos-7, rockylinux-8, rockylinux-9]
          requires:
            - preparation-<< matrix.platform >>

      # - kazoo/eunit-tests:
      #     context: Private-Builds
      #     requires:
      #       - preparation-centos-7
      - kazoo/code-checks:
          requires:
            - beams-centos-7

      # - kazoo/docs:
      #     requires:
      #       - beams-centos-7
      # - kazoo/analyze:
      #     requires:
      #       - beams-centos-7
      # - kazoo/integration-test:
      #     requires:
      #       - beams-centos-7
      - kazoo/wait-on-tests:
          requires:
            # - kazoo/eunit-tests
            - kazoo/code-checks
            # - kazoo/docs
            # - kazoo/analyze
            # - kazoo/integration-test
      - kazoo/build-centos7:
          context: Private-Builds
          target-type: kapp
          requires:
            - kazoo/wait-on-tests
      - kazoo/build-rockylinux8:
          context: Private-Builds
          target-type: kapp
          requires:
            - beams-rockylinux-8
            - kazoo/wait-on-tests
      - kazoo/build-rockylinux9:
          context: Private-Builds
          target-type: kapp
          requires:
            - beams-rockylinux-9
            - kazoo/wait-on-tests

