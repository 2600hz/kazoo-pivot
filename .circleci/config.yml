---
version: 2.1

orbs:
  kazoo: official-2600hz/kazoo@dev:alpha

workflows:
  version: 2
  build_branch:
    jobs:
      - kazoo/build-preparation:
          context: Private-Builds
          target-type: kapp
      - kazoo/build:
          name: beams-<< matrix.platform >>
          context: Private-Builds
          matrix:
            parameters:
              platform: ["centos7", "rocky8", "rocky9"]
          requires:
            - kazoo/build-preparation

      - kazoo/eunit-tests:
          context: Private-Builds
          requires:
            - kazoo/build-preparation
      - kazoo/code-checks:
          requires:
            - beams-centos7
      - kazoo/docs:
          requires:
            - beams-centos7
      - kazoo/analyze:
          requires:
            - beams-centos7
      - kazoo/integration-test:
          requires:
            - beams-centos7
      - kazoo/wait-on-tests:
          requires:
            - kazoo/eunit-tests
            - kazoo/code-checks
            - kazoo/docs
            - kazoo/analyze
            # - kazoo/integration-test
      - kazoo/build-centos7:
          context: Private-Builds
          target-type: kapp
          requires:
            - kazoo/wait-on-tests
      - kazoo/build-rockylinux8:
          context: Private-Builds
          target-type: kapp
          requires:
            - beams-rocky8
            - kazoo/wait-on-tests
      - kazoo/build-rockylinux9:
          context: Private-Builds
          target-type: kapp
          requires:
            - beams-rocky9
            # - kazoo/wait-on-tests

